name: Linux backend integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-backend-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-integration-and-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: aik_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aik_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      AIK_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/aik_test_ci
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres@127.0.0.1:5432/aik_migration_ci

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install Poetry 2.3.4
        run: python -m pip install "poetry==2.3.4"

      - name: Install locked backend dependencies
        run: poetry install --all-extras --sync --no-interaction

      - name: Verify PostgreSQL test database guard
        run: poetry run pytest tests/unit/test_postgres_test_database_config.py -q

      - name: Run organizer result integration suite on PostgreSQL
        run: poetry run pytest tests/integration/test_admin_match_result_recording.py -q

      - name: Create disposable migration database
        run: createdb --host 127.0.0.1 --username postgres aik_migration_ci

      - name: Upgrade full migration history and verify revision 0018
        shell: bash
        run: |
          poetry run alembic upgrade head
          revision="$(poetry run alembic current)"
          printf '%s\n' "$revision"
          [[ "$revision" == *0018_match_result_provenance* ]]

      - name: Check full-history downgrade refusal and verify safe 0018 rollback
        shell: bash
        run: |
          set +e
          downgrade_output="$(poetry run alembic downgrade base 2>&1)"
          downgrade_status=$?
          set -e
          printf '%s\n' "$downgrade_output"
          if [[ "$downgrade_status" -eq 0 ]]; then
            echo "Expected immutable-history downgrade guard did not reject downgrade to base" >&2
            exit 1
          fi
          [[ "$downgrade_output" == *"0009 creates immutable development policy and House AI evidence"* ]]
          revision="$(poetry run alembic current)"
          printf 'Revision after guarded downgrade: %s\n' "$revision"
          [[ "$revision" == *0018_match_result_provenance* ]]
          poetry run alembic downgrade 0017_dev_match_approved
          poetry run alembic upgrade head
          revision="$(poetry run alembic current)"
          printf 'Revision after 0018 rollback and re-upgrade: %s\n' "$revision"
          [[ "$revision" == *0018_match_result_provenance* ]]
