# AI Knockout Redis Configuration
# Phase 1: Foundation only

# Network — bind inside container (Docker network handles isolation)
bind 0.0.0.0
protected-mode no
port 6379

# Persistence — AOF for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Timeouts
timeout 300
tcp-keepalive 60
